[project]
name = "baremetal-transformer"
version = "0.1.0"
description = "Neural networks & transformers from scratch in NumPy, plus a C++17 SIMD/INT8 inference engine"
requires-python = ">=3.10"
dependencies = ["numpy"]

[project.optional-dependencies]
torch = ["torch"]
dev = ["pytest", "matplotlib"]

[tool.pytest.ini_options]
testpaths = ["python_scratch"]
pythonpath = ["python_scratch"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
